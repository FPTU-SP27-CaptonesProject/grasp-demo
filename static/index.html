<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GRASP Comparative Demo</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <header class="topbar">
      <div><strong>GRASP</strong><span>Comparative RAG Demo</span></div>
      <div id="health" class="health">Checking services...</div>
      <button id="theme" class="icon" title="Toggle theme" aria-label="Toggle theme">◐</button>
    </header>
    <main>
      <section class="controls" aria-label="Question controls">
        <label>Dataset <select id="dataset"><option value="">All datasets</option><option value="2wiki_ircot">2Wiki</option><option value="hotpotqa_abstracts_2017">HotpotQA</option><option value="wiki18">NQ/Wiki18</option></select></label>
        <label class="wide">Evaluation question <input id="eval-search" list="eval-list" placeholder="Search a benchmark question"></label>
        <datalist id="eval-list"></datalist>
        <button id="random" class="icon" title="Choose a random evaluation question" aria-label="Choose random question">↻</button>
        <span class="or">or</span>
        <label class="wide">Free question <input id="free-question" placeholder="Ask a question"></label>
        <label>Corpus <select id="free-corpus"><option value="wiki18">NQ/Wiki18</option><option value="2wiki_ircot">2Wiki</option><option value="hotpotqa_abstracts_2017">HotpotQA</option></select></label>
        <fieldset id="columns"><legend>Methods</legend><label><input type="checkbox" value="rag_7b" checked> RAG 7B</label><label><input type="checkbox" value="rag_235b" checked> RAG 235B</label><label><input type="checkbox" value="ircot_7b" checked> IRCoT 7B</label><label><input type="checkbox" value="grasp_sft" checked> GRASP SFT</label><label><input type="checkbox" value="grasp_grpo" checked> GRASP GRPO</label></fieldset>
        <button id="ask" class="ask">Ask</button><button id="history" class="icon" title="View saved runs" aria-label="View saved runs">◷</button>
      </section>
      <section id="question-info" class="question-info" hidden></section>
      <section id="board" class="board" aria-live="polite"></section>
    </main>
    <dialog id="history-dialog"><header><strong>Saved Runs</strong><label>Replay speed <select id="replay-speed"><option value="1">1x</option><option value="4">4x</option></select></label><button class="icon" id="close-history" aria-label="Close">×</button></header><div id="history-list"></div></dialog>
    <template id="column-template"><article class="column"><header><div><h2></h2><small class="checkpoint"></small></div><div class="metrics">Waiting</div></header><div class="trace"></div><footer class="answer"></footer></article></template>
    <template id="event-template"><details class="event"><summary></summary><pre></pre></details></template>
    <script src="/static/app.js"></script>
  </body>
</html>
